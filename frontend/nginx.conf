# ============================================
# SISTEMA DE CONTROL DE ACCESOS - FRONTEND
# Configuración de Nginx
# ============================================

server {
    listen 80;
    server_name localhost;

    # Directorio raíz de la aplicación
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Tamaño máximo de carga para archivos
    client_max_body_size 50M;

    # Compresión Gzip para mejor rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================
    # RUTAS PRINCIPALES
    # ============================================

    # Servir archivos estáticos
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # Servir assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # ============================================
    # PROXY PARA EL BACKEND
    # ============================================
    
    # API: Redirigir peticiones al backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para operaciones largas (reconocimiento facial)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check del backend
    location /api/health {
        proxy_pass http://backend:5000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================
    # WEBSOCKETS (si se usan en el futuro)
    # ============================================
    location /ws/ {
        proxy_pass http://backend:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ============================================
    # RUTA PRINCIPAL (SPA - Single Page Application)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # PÁGINA DE ERROR 404
    # ============================================
    error_page 404 /index.html;
    location = /index.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ============================================
    # DENEGAR ACCESO A ARCHIVOS OCULTOS
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}